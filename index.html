<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Hub — Study Reviewer</title>
<style>
  :root{
    --ink:#1c2430;
    --paper:#f7f5f0;
    --card:#ffffff;
    --line:#d8d3c6;
    --accent:#2e5f4e;
    --accent-soft:#e4efe9;
    --wrong:#a3372c;
    --wrong-soft:#f6e6e3;
    --muted:#6b6558;
    --sidebar:#efece3;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eae6da; --paper:#14181a; --card:#1c2225; --line:#333b3a;
      --accent:#7fbfa2; --accent-soft:#20302a; --wrong:#e18b7f; --wrong-soft:#3a2320; --muted:#9a9587; --sidebar:#1a1e20;
    }
  }
  :root[data-theme="dark"]{
    --ink:#eae6da; --paper:#14181a; --card:#1c2225; --line:#333b3a;
    --accent:#7fbfa2; --accent-soft:#20302a; --wrong:#e18b7f; --wrong-soft:#3a2320; --muted:#9a9587; --sidebar:#1a1e20;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    line-height:1.5;
  }
  .shell{display:flex;min-height:100%;}

  /* Sidebar */
  .sidebar{
    width:230px;flex:0 0 230px;background:var(--sidebar);border-right:1px solid var(--line);
    padding:1.4rem 1rem;padding-top:calc(1.4rem + env(safe-area-inset-top,0px));
  }
  .sidebar h2{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .9rem;font-weight:600;}
  .subject-btn{
    display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;
    color:var(--ink);font-family:inherit;font-size:.95rem;padding:.6rem .7rem;border-radius:5px;
    cursor:pointer;margin-bottom:.4rem;
  }
  .subject-btn:hover{background:var(--accent-soft);}
  .subject-btn.active{background:var(--accent);color:var(--paper);}
  .subject-progress{font-size:.72rem;color:var(--muted);margin-top:.15rem;padding-left:.7rem;}
  .subject-btn.active + .subject-progress{color:var(--paper);opacity:.75;}

  /* Mobile: sidebar becomes a horizontal tab row */
  @media (max-width: 720px){
    .shell{flex-direction:column;}
    .sidebar{
      width:100%;flex:0 0 auto;display:flex;gap:.5rem;overflow-x:auto;
      border-right:none;border-bottom:1px solid var(--line);padding:1rem;
    }
    .sidebar h2{display:none;}
    .subject-btn{white-space:nowrap;margin-bottom:0;width:auto;}
    .subject-progress{display:none;}
  }

  main{flex:1;min-width:0;}
  .wrap{max-width:760px;margin:0 auto;padding:2.2rem 1.25rem 4rem;}
  header.top{margin-bottom:1.6rem;}
  h1{font-size:1.5rem;margin:0 0 .2rem;font-weight:700;letter-spacing:.2px;}
  .sub{color:var(--muted);font-size:.95rem;margin:0 0 1.1rem;}
  .meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.6rem 0;margin-bottom:1.6rem;}

  .go{
    display:inline-block;margin-top:.4rem;background:var(--accent);color:var(--paper);
    border:none;padding:.75rem 1.4rem;font-size:1rem;font-family:inherit;border-radius:3px;cursor:pointer;
  }
  .go:hover{opacity:.9;}
  .go.outline{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .go.outline:hover{background:var(--accent-soft);opacity:1;}
  .start-actions{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;}
  .start-actions .go{margin-top:0;}
  .shuffled-tag{font-size:.82rem;color:var(--muted);margin-top:.7rem;margin-bottom:0;}

  .progress-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem;font-size:.85rem;color:var(--muted);}
  .barwrap{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:1.6rem;}
  .bar{height:100%;background:var(--accent);width:0%;transition:width .25s ease;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:1.4rem 1.4rem 1.2rem;margin-bottom:1.1rem;
  }
  .qnum{font-size:.78rem;letter-spacing:.03em;color:var(--muted);margin-bottom:.35rem;}
  .qtext{font-size:1.08rem;margin:0 0 1rem;font-weight:600;}
  .opt{
    display:flex;gap:.65rem;align-items:flex-start;padding:.55rem .6rem;border-radius:4px;
    cursor:pointer;border:1px solid transparent;
  }
  .opt:hover{background:var(--accent-soft);}
  .opt input{margin-top:.2rem;accent-color:var(--accent);flex:0 0 auto;}
  .opt span{font-size:.98rem;}
  .opt.locked{cursor:default;}
  .opt.correct{background:var(--accent-soft);border-color:var(--accent);}
  .opt.incorrect{background:var(--wrong-soft);border-color:var(--wrong);}
  .opt.selected-draft{background:var(--accent-soft);border-color:var(--accent);}
  .opt.locked:hover{background:inherit;}

  .navrow{display:flex;justify-content:space-between;gap:.75rem;margin-top:1.3rem;}
  button.nav{
    background:transparent;border:1px solid var(--ink);color:var(--ink);
    padding:.6rem 1.1rem;font-family:inherit;font-size:.95rem;border-radius:3px;cursor:pointer;
  }
  button.nav.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  button.nav:disabled{opacity:.35;cursor:not-allowed;}

  .score-big{font-size:3rem;font-weight:700;margin:.6rem 0 0;}
  .score-label{color:var(--muted);font-size:1rem;margin-bottom:1.6rem;}
  .review-item{text-align:left;}
  .review-item .qtext{font-weight:600;}
  .tag-correct{color:var(--accent);font-weight:600;}
  .tag-wrong{color:var(--wrong);font-weight:600;}
  .restart{
    display:inline-block;margin-top:1rem;background:var(--accent);color:var(--paper);
    border:none;padding:.7rem 1.3rem;font-family:inherit;font-size:.95rem;border-radius:3px;cursor:pointer;
  }
  .restart.outline{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .restart.outline:hover{background:var(--accent-soft);}
  .result-actions{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;}
  .result-actions .restart{margin-top:0;}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:2.5rem;}
</style>
</head>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>

    <div class="wrap" id="app"></div>

let activeSubject = 'siaa';
const state = {};
Object.keys(SUBJECTS).forEach(id => {
  state[id] = { screen: 'start', current: 0, answers: new Array(SUBJECTS[id].questions.length).fill(null), draft: { choice: null }, shuffled: false };
});

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<h2>Subjects</h2>';
  Object.values(SUBJECTS).forEach(subj => {
    const st = state[subj.id];
    const answeredCount = st.answers.filter(a => a !== null).length;
    const btn = document.createElement('button');
    btn.className = 'subject-btn' + (subj.id === activeSubject ? ' active' : '');
    btn.textContent = subj.navLabel;
    btn.onclick = () => { activeSubject = subj.id; renderSidebar(); renderApp(); };
    sb.appendChild(btn);
    const prog = document.createElement('div');
    prog.className = 'subject-progress';
    prog.textContent = st.screen === 'result' ? 'Completed' : (answeredCount > 0 ? answeredCount + ' / ' + subj.questions.length + ' answered' : subj.questions.length + ' questions');
    sb.appendChild(prog);
  });
}

function renderApp(){
  const subj = SUBJECTS[activeSubject];
  const st = state[activeSubject];
  const app = document.getElementById('app');
  if(st.screen === 'start'){
    app.innerHTML = `
      <header class="top">
        <h1>${subj.title}</h1>
        <p class="sub">${subj.subtitle}</p>
      </header>
      <div class="meta">
        <span>${subj.questions.length} questions</span>
        <span>Multiple choice</span>
        <span>Score shown at the end</span>
      </div>
      <p>${subj.intro}</p>
      <div class="start-actions">
        <button class="go" onclick="startQuiz()">Start quiz</button>
        <button class="go outline" onclick="shuffleFromStart('${subj.id}')">🔀 Shuffle questions</button>
      </div>
      ${st.shuffled ? '<p class="shuffled-tag">Questions shuffled ✓</p>' : ''}
      <footer>${subj.footer}</footer>
    `;
  } else if(st.screen === 'quiz'){
    renderQuestion();
  } else if(st.screen === 'result'){
    renderResults();
  }
}

function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleFromStart(id){
  const subj = SUBJECTS[id];
  shuffleArray(subj.questions);
  state[id].shuffled = true;
  renderApp();
}

function shuffleAndRetake(){
  const subj = SUBJECTS[activeSubject];
  shuffleArray(subj.questions);
  restart();
  state[activeSubject].shuffled = true;
  renderApp();
}

function startQuiz(){
  state[activeSubject].screen = 'quiz';
  state[activeSubject].current = 0;
  state[activeSubject].draft = { choice: null };
  renderSidebar();
  renderApp();
}

function escapeHtml(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function normText(s){
  return String(s ?? '').trim().toLowerCase().replace(/[().;]/g,'').replace(/\s+/g,' ');
}

function isCorrect(qd, ans){
  if(ans === null || ans === undefined) return false;
  if(qd.type === 'identification'){
    const normAns = normText(ans);
    if(!normAns) return false;
    const accepted = [qd.a, ...(qd.accept||[])].map(normText).filter(Boolean);
    return accepted.some(a => a === normAns || (a.length > 3 && (normAns.includes(a) || a.includes(normAns))));
  }
  if(qd.type === 'debugging'){
    return ans && ans.choice === qd.a;
  }
  return ans === qd.a;
}

function scoreOf(subj, st){
  return st.answers.reduce((s,v,i)=> s + (isCorrect(subj.questions[i], v)?1:0), 0);
}

function sectionLabel(subj, idx){
  if(!subj.sections) return null;
  for(const sec of subj.sections){
    if(idx >= sec.start && idx < sec.end) return sec.label;
  }
  return null;
}

function renderQuestion(){
  const subj = SUBJECTS[activeSubject];
  const st = state[activeSubject];
  const qd = subj.questions[st.current];
  const chosen = st.answers[st.current];
  const answered = chosen !== null && chosen !== undefined;
  const app = document.getElementById('app');

  const scored = scoreOf(subj, st);
  const secLabel = sectionLabel(subj, st.current);

  let bodyHtml = '';
  if(qd.type === 'identification'){
    const correct = answered ? isCorrect(qd, chosen) : null;
    bodyHtml = `
      <input type="text" id="idInput" ${answered?'disabled':''}
        value="${answered ? escapeHtml(chosen).replace(/"/g,'&quot;') : ''}"
        placeholder="Type your answer..."
        style="width:100%;padding:.6rem .7rem;font-family:inherit;font-size:1rem;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:.6rem;"
        onkeydown="if(event.key==='Enter'){checkIdentification();}">
      ${!answered ? '<button class="nav primary" onclick="checkIdentification()">Check answer</button>' : `
        <p style="margin:.4rem 0;">${correct ? '<span class="tag-correct">Correct.</span>' : '<span class="tag-wrong">Not quite.</span>'}</p>
        ${!correct ? '<p style="margin:.3rem 0;">Correct answer: <span class="tag-correct">'+escapeHtml(qd.a)+'</span></p>' : ''}
      `}
    `;
  } else if(qd.type === 'debugging'){
    if(answered){
      const correct = isCorrect(qd, chosen);
      let optsHtml = '';
      qd.o.forEach((text, i) => {
        let cls = 'opt locked';
        if(i === qd.a) cls += ' correct';
        else if(i === chosen.choice && chosen.choice !== qd.a) cls += ' incorrect';
        optsHtml += `<label class="${cls}"><input type="radio" disabled ${chosen.choice===i?'checked':''}> <span>${text}</span></label>`;
      });
      bodyHtml = `
        <pre style="white-space:pre-wrap;background:var(--accent-soft);border-radius:4px;padding:.8rem;font-family:monospace;font-size:.9rem;margin-bottom:1rem;">${qd.q.replace(/</g,'&lt;')}</pre>
        ${optsHtml}
        ${chosen.choice === 0 ? `<div style="margin-top:.8rem;"><div class="qnum">YOUR REWRITE</div><pre style="white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.7rem;font-family:monospace;font-size:.9rem;">${(chosen.rewrite||'').replace(/</g,'&lt;')}</pre></div>` : ''}
        <p style="margin-top:.6rem;">${correct ? '<span class="tag-correct">Correct.</span>' : '<span class="tag-wrong">Not quite — correct answer: '+qd.o[qd.a]+'</span>'}</p>
      `;
    } else {
      const draft = st.draft;
      let optsHtml = '';
      qd.o.forEach((text, i) => {
        const cls = 'opt' + (draft.choice === i ? ' selected-draft' : '');
        optsHtml += `<label class="${cls}" onclick="selectDebugChoice(${i})"><input type="radio" name="dbg" ${draft.choice===i?'checked':''}> <span>${text}</span></label>`;
      });
      bodyHtml = `
        <pre style="white-space:pre-wrap;background:var(--accent-soft);border-radius:4px;padding:.8rem;font-family:monospace;font-size:.9rem;margin-bottom:1rem;">${qd.q.replace(/</g,'&lt;')}</pre>
        ${optsHtml}
        ${draft.choice === 0 ? `
          <div style="margin-top:.9rem;">
            <div class="qnum">REWRITE THE QUERY SO IT'S CORRECT</div>
            <textarea id="rewriteInput" rows="3" placeholder="Type your corrected query here..."
              style="width:100%;padding:.6rem .7rem;font-family:monospace;font-size:.9rem;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:.4rem 0;"></textarea>
            <button class="nav primary" onclick="submitDebugAnswer()">Submit answer</button>
          </div>
        ` : (draft.choice === 1 ? '<button class="nav primary" style="margin-top:.8rem;" onclick="submitDebugAnswer()">Submit answer</button>' : '')}
      `;
    }
  } else {
    let optsHtml = '';
    qd.o.forEach((text, i) => {
      let cls = 'opt' + (answered ? ' locked' : '');
      if(answered){
        if(i === qd.a) cls += ' correct';
        else if(i === chosen && chosen !== qd.a) cls += ' incorrect';
      }
      optsHtml += `<label class="${cls}" ${!answered ? 'onclick="selectAnswer('+i+')"' : ''}>
        <input type="radio" name="opt" ${chosen===i?'checked':''} ${answered?'disabled':''}> <span>${escapeHtml(text)}</span>
      </label>`;
    });
    bodyHtml = optsHtml;
  }

  app.innerHTML = `
    <div class="progress-row">
      <span>Question ${st.current+1} of ${subj.questions.length}${secLabel ? ' — ' + secLabel : ''}</span>
      <span>Score: ${scored}</span>
    </div>
    <div class="barwrap"><div class="bar" style="width:${(st.current/subj.questions.length*100)}%"></div></div>
    <div class="card">
      <div class="qnum">${secLabel ? secLabel.toUpperCase() + ' — ' : ''}QUESTION ${st.current+1} OF ${subj.questions.length}</div>
      ${qd.type === 'debugging' ? '' : '<p class="qtext">'+escapeHtml(qd.q)+'</p>'}
      ${bodyHtml}
    </div>
    <div class="navrow">
      <button class="nav" ${st.current===0?'disabled':''} onclick="go(-1)">Back</button>
      <button class="nav primary" ${!answered?'disabled':''} onclick="go(1)">${st.current===subj.questions.length-1?'Finish':'Next'}</button>
    </div>
  `;
}

function selectAnswer(i){
  const st = state[activeSubject];
  st.answers[st.current] = i;
  renderQuestion();
  renderSidebar();
}

function selectDebugChoice(i){
  const st = state[activeSubject];
  st.draft = { choice: i };
  renderQuestion();
}

function submitDebugAnswer(){
  const st = state[activeSubject];
  const choice = st.draft.choice;
  if(choice === null || choice === undefined) return;
  if(choice === 0){
    const el = document.getElementById('rewriteInput');
    const rewrite = el ? el.value.trim() : '';
    if(!rewrite) return;
    st.answers[st.current] = { choice: 0, rewrite };
  } else {
    st.answers[st.current] = { choice: 1, rewrite: null };
  }
  st.draft = { choice: null };
  renderQuestion();
  renderSidebar();
}

function checkIdentification(){
  const st = state[activeSubject];
  const input = document.getElementById('idInput');
  const val = input ? input.value.trim() : '';
  if(!val) return;
  st.answers[st.current] = val;
  renderQuestion();
  renderSidebar();
}

function go(dir){
  const subj = SUBJECTS[activeSubject];
  const st = state[activeSubject];
  const ans = st.answers[st.current];
  if(dir === 1 && (ans === null || ans === undefined)) return;
  if(st.current === subj.questions.length-1 && dir === 1){
    st.screen = 'result';
    renderSidebar();
    renderApp();
    return;
  }
  st.current += dir;
  st.draft = { choice: null };
  renderQuestion();
}

function renderResults(){
  const subj = SUBJECTS[activeSubject];
  const st = state[activeSubject];
  const app = document.getElementById('app');
  const score = scoreOf(subj, st);

  let reviewHtml = '<h3 style="margin-bottom:1rem;">Review</h3>';
  subj.questions.forEach((qd,i)=>{
    const ans = st.answers[i];
    const correct = isCorrect(qd, ans);
    let yourAnswerText, correctAnswerText, qtextHtml, extraHtml = '';
    if(qd.type === 'identification'){
      yourAnswerText = escapeHtml(ans ?? '(skipped)');
      correctAnswerText = escapeHtml(qd.a);
      qtextHtml = '<p class="qtext">'+escapeHtml(qd.q)+'</p>';
    } else if(qd.type === 'debugging'){
      yourAnswerText = escapeHtml(ans ? qd.o[ans.choice] : '(skipped)');
      correctAnswerText = escapeHtml(qd.o[qd.a]);
      qtextHtml = '<pre style="white-space:pre-wrap;background:var(--accent-soft);border-radius:4px;padding:.7rem;font-family:monospace;font-size:.88rem;margin-bottom:.6rem;">'+escapeHtml(qd.q)+'</pre>';
      if(ans && ans.choice === 0 && ans.rewrite){
        extraHtml = '<div class="qnum" style="margin-top:.4rem;">YOUR REWRITE</div><pre style="white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.6rem;font-family:monospace;font-size:.85rem;">'+escapeHtml(ans.rewrite)+'</pre>';
      }
    } else {
      yourAnswerText = escapeHtml((qd.o && ans !== null && ans !== undefined) ? qd.o[ans] : '(skipped)');
      correctAnswerText = escapeHtml(qd.o[qd.a]);
      qtextHtml = '<p class="qtext">'+escapeHtml(qd.q)+'</p>';
    }
    const secLabel = sectionLabel(subj, i);
    reviewHtml += `
      <div class="card review-item">
        <div class="qnum">${secLabel ? secLabel.toUpperCase() + ' — ' : ''}QUESTION ${i+1}</div>
        ${qtextHtml}
        <p style="margin:.3rem 0;">Your answer: <span class="${correct?'tag-correct':'tag-wrong'}">${yourAnswerText}</span></p>
        ${!correct ? '<p style="margin:.3rem 0;">Correct answer: <span class="tag-correct">'+correctAnswerText+'</span></p>' : ''}
        ${extraHtml}
        ${qd.exp ? '<p style="margin:.3rem 0;color:var(--muted);font-size:.9rem;">'+escapeHtml(qd.exp)+'</p>' : ''}
      </div>
    `;
  });

  app.innerHTML = `
    <div style="text-align:center;">
      <p class="score-label">You scored</p>
      <p class="score-big">${score} / ${subj.questions.length}</p>
      <p class="score-label">${Math.round(score/subj.questions.length*100)}% correct</p>
      <div class="result-actions">
        <button class="restart" onclick="restart()">Retake quiz</button>
        <button class="restart outline" onclick="shuffleAndRetake()">🔀 Shuffle &amp; retake</button>
      </div>
    </div>
    <div style="margin-top:2rem;text-align:left;">${reviewHtml}</div>
  `;
}

function restart(){
  const subj = SUBJECTS[activeSubject];
  state[activeSubject] = { screen: 'start', current: 0, answers: new Array(subj.questions.length).fill(null), draft: { choice: null }, shuffled: false };
  renderSidebar();
  renderApp();
}

renderSidebar();
renderApp();
</script>
</body>
</html>
